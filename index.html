const A_NR = { 13: [3, 6, 22, 23], 14: [3, 6, 22, 23], 15: [8, 26], 16: [8] };
const A_SPAR = [A_KAT.doener, A_KAT.doener, A_NR[14], A_KAT.burger, A_NR[15], A_KAT.schn, [...A_KAT.doener, ...A_NR[14]]];

function kennText(codes) {
  const c = [...new Set(codes)].sort((a, b) => a - b), al = [...new Set(c.filter(ALLERGEN).map(n => KENN[n]))], zu = c.filter(n => !ALLERGEN(n)).map(n => KENN[n]);
  return (al.length ? `<b>Allergene:</b> ${al.join(', ')}` : '') + (al.length && zu.length ? '<br>' : '') + (zu.length ? `<b>Zusatzstoffe:</b> ${zu.join(', ')}` : '');
}
function kennBlock(g) {
  const saucen = (g.o || []).includes(SAUCE) || /Sauce|Ketchup|Joppie|Tzatziki/.test(g.b || '');
  if (!g.a && !saucen) return '';

}

}

  c.addEventListener('touchend', e => { if (!t0) return; const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY; if (Math.max(Math.abs(dx), Math.abs(dy)) > 14) Math.abs(dx) > Math.abs(dy) ? lenke(Math.sign(dx), 0) : lenke(0, Math.sign(dy)); t0 = null; });
  SP.koenig = [{ x: 5, y: 6 }]; SP.r = { x: 1, y: 0 }; SP.doener = { x: 8, y: 6 }; SP.punkte = 0; SP.aus = false; male();
}
function neuerDoener() { do { SP.doener = { x: Math.floor(Math.random() * SP.sp), y: Math.floor(Math.random() * SP.ze) }; } while (SP.koenig.some(k => k.x === SP.doener.x && k.y === SP.doener.y)); }
function starteSpiel() {
  clearTimeout(SP.lauf); SP.koenig = [{ x: 5, y: 6 }, { x: 4, y: 6 }, { x: 3, y: 6 }]; SP.r = { x: 1, y: 0 }; SP.naechste = []; SP.punkte = 0; SP.aus = false; neuerDoener();
  $('#spPunkte').textContent = 0; $('#spStart').classList.add('versteckt'); schritt();
}
function lenke(x, y) { if (!SP.naechste) return; const l = SP.naechste.length ? SP.naechste[SP.naechste.length - 1] : SP.r; if (l.x === -x && l.y === -y || l.x === x && l.y === y) return; if (SP.naechste.length < 2) SP.naechste.push({ x, y }); }
function schritt() {
  if (!$('#spFeld')) return;
  if (SP.naechste.length) SP.r = SP.naechste.shift();
  const k = SP.koenig[0], n = { x: (k.x + SP.r.x + SP.sp) % SP.sp, y: (k.y + SP.r.y + SP.ze) % SP.ze };
  if (SP.koenig.slice(0, -1).some(s => s.x === n.x && s.y === n.y)) return ende();
  SP.koenig.unshift(n);
  if (n.x === SP.doener.x && n.y === SP.doener.y) { SP.punkte++; $('#spPunkte').textContent = SP.punkte; neuerDoener(); } else SP.koenig.pop();
  male(); SP.lauf = setTimeout(schritt, Math.max(95, 230 - SP.punkte * 7));
}
function ende() {
  SP.aus = true; SP.naechste = null; male(); const neu = SP.punkte > rekord(); if (neu) rekord(SP.punkte); $('#spRekord').textContent = rekord();
  const b = $('#spStart'); b.textContent = (neu ? 'Neuer Rekord: ' : '') + SP.punkte + ' Döner · Nochmal'; b.classList.remove('versteckt');
}
function male() {
  const c = SP.ctx, z = SP.z, B = z * SP.sp, H = z * SP.ze; c.clearRect(0, 0, B, H);
  c.fillStyle = 'rgba(255,255,255,.07)'; for (let x = 0; x < SP.sp; x++) for (let y = 0; y < SP.ze; y++) { c.beginPath(); c.arc(x * z + z / 2, y * z + z / 2, 1.2, 0, 7); c.fill(); }
  const d = SP.bilder['g_doener_t.png'], g = z * 1.5; if (d.complete && d.naturalWidth) c.drawImage(d, SP.doener.x * z + z / 2 - g / 2, SP.doener.y * z + z / 2 - g * d.naturalHeight / d.naturalWidth / 2, g, g * d.naturalHeight / d.naturalWidth);
  SP.koenig.forEach((s, i) => { if (!i) return; c.fillStyle = `rgba(245,197,24,${Math.max(.35, 1 - i * .06)})`; c.beginPath(); c.arc(s.x * z + z / 2, s.y * z + z / 2, z * .36, 0, 7); c.fill(); });
  const k = SP.koenig[0], kx = k.x * z + z / 2, ky = k.y * z + z / 2; c.fillStyle = SP.aus ? '#ff5a5f' : '#F5C518'; c.beginPath(); c.arc(kx, ky, z * .56, 0, 7); c.fill();
  c.fillStyle = '#000'; c.beginPath(); c.arc(kx, ky, z * .44, 0, 7); c.fill();
  const kr = SP.bilder['krone.svg']; if (kr.complete && kr.naturalWidth) c.drawImage(kr, kx - z * .32, ky - z * .16, z * .64, z * .64 * 694 / 1462);
}
document.addEventListener('keydown', e => { const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key]; if (m && $('#spFeld')) { e.preventDefault(); lenke(...m); } });
baue();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
